name: Daily export email

on:
  schedule:
    - cron: "45 2 * * *"        # 05:45 Kampala (UTC+3), daily
  workflow_dispatch:
    inputs:
      force:
        description: "Send even if paused / target reached"
        type: boolean
        default: false
      dry_run:
        description: "Build the email and print it, but do not send"
        type: boolean
        default: false

concurrency:
  group: digest
  cancel-in-progress: false

permissions:
  contents: write     # commit state/digest.json

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pull from KoboToolbox
        env:
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
        run: python scripts/kobo_pull.py

      - name: Build summary
        run: python scripts/summarize.py

      - name: Send digest
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          EXPORT_ZIP_PASSWORD: ${{ secrets.EXPORT_ZIP_PASSWORD }}
          DIGEST_FORCE: ${{ inputs.force && '1' || '0' }}
          DIGEST_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python scripts/send_digest.py

      - name: Record digest state
        run: |
          git config user.name "sense-dashboards[bot]"
          git config user.email "sense-dashboards@users.noreply.github.com"
          git add state/digest.json
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "Digest sent $(date -u +'%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi
