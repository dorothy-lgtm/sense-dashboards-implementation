name: Refresh SENSE dashboards

on:
  schedule:
    - cron: "17 */2 * * *"      # every 2 hours (UTC); edit freely
  workflow_dispatch:            # "Run workflow" button in the Actions tab
  push:
    paths:
      - "site/**"
      - "scripts/**"
      - "config/**"
      - ".github/workflows/refresh.yml"

# Only one refresh at a time; a new one cancels an older queued one
concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write     # commit site/data/summary.json back to the repo
  pages: write        # publish to GitHub Pages
  id-token: write     # required by deploy-pages

jobs:
  pull-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pull from KoboToolbox
        env:
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
        run: python scripts/kobo_pull.py

      - name: Build aggregate summary and school roster
        run: |
          python scripts/summarize.py
          python scripts/roster.py
          python scripts/metrics.py

      # Encrypt the data files with the team passphrase. Without the secret the step removes the
      # plaintext so the published site carries no school-level data at all.
      - name: Encrypt data for publication
        env:
          SITE_PASSPHRASE: ${{ secrets.SITE_PASSPHRASE }}
        run: python scripts/encrypt_data.py || [ $? -eq 3 ]

      - name: Commit refreshed (encrypted) data
        run: |
          git config user.name "sense-dashboards[bot]"
          git config user.email "sense-dashboards@users.noreply.github.com"
          git rm -q --cached --ignore-unmatch site/data/summary.json site/data/roster.json site/data/metrics.json
          git add -A site/data
          if git diff --cached --quiet; then
            echo "No change in summary"
          else
            git commit -m "Refresh summary $(date -u +'%Y-%m-%d %H:%MZ')"
            git pull --rebase origin main
            git push
          fi

      # Team exports (raw Kobo XLSX/CSV, incl. contact fields). Never committed to git and
      # never attached as a run artifact (the repo is public). Pushed to the team's Box
      # folder when the BOX_* secrets are set; skipped otherwise.
      - name: Upload exports to Box
        env:
          BOX_CLIENT_ID: ${{ secrets.BOX_CLIENT_ID }}
          BOX_CLIENT_SECRET: ${{ secrets.BOX_CLIENT_SECRET }}
          BOX_SUBJECT_TYPE: ${{ vars.BOX_SUBJECT_TYPE }}
          BOX_SUBJECT_ID: ${{ vars.BOX_SUBJECT_ID }}
          BOX_FOLDER_ID: ${{ vars.BOX_FOLDER_ID }}
          BOX_SUBFOLDER_BY_DATE: ${{ vars.BOX_SUBFOLDER_BY_DATE }}
        run: python scripts/box_upload.py

      - name: Stamp build version into the page (cache-busting)
        run: sed -i "s/__BUILD__/${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}/g" site/index.html

      - name: Package site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: pull-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
