# SENSE study — KoboToolbox forms feeding the dashboards.
#
# `key`        short slug used for file names and dashboard tabs
# `uid`        Kobo asset UID (from the form URL or the Project > Settings page)
# `group_by`   question names to break submissions down by (matched case-insensitively
#              against the last segment of each question's xpath, so "district" matches
#              "section_a/district"). Missing names are reported, not fatal.
# `dedupe_key` question names that together should be unique per submission; repeats
#              are flagged as duplicates on the data-quality panel.
# `target`     expected total submissions, for progress tiles (optional)
# `export_setting_uid`  which saved export (Kobo > Data > Downloads) to fetch as the team's
#              XLSX/CSV copy; defaults to the first one on the form (optional)

kobo:
  base_url: https://kf.kobotoolbox.org
  page_size: 5000          # rows per API page; Kobo accepts up to 30000
  lookback_days: 60        # window for the per-day chart; all-time totals are always computed

forms:
  - key: enrolment
    name: "Annex F — School Enrolment CRF (Form A)"
    uid: ak95trCoSBkM3aKqZysbdB
    group_by: [district, region, school_name]
    dedupe_key: [school_code]
    target: 165

  - key: structure_vector
    name: "Annex G — Structure, Prevention & Vector (Form B)"
    uid: axDMBKEfMJYtZ5LiHqCMbb
    group_by: [district, region, school_name]
    dedupe_key: []               # one school is often entered in several parts; metrics.py collates them (exact re-sends are dropped there)
    target: 165

  - key: retrospective
    name: "Annex H — Retrospective Data"
    uid: aokEegtT2X8oyCDfQCWeZR
    export_setting_uid: es8TZRSGhSxbUaaNJr5rWoq
    group_by: [district, region, school_name]
    dedupe_key: [school_code]
    target: 165

  - key: school_assessment
    name: "School Assessment Checklist"
    uid: ajj7kZq2be5XDFSio3zJHu
    group_by: [district, school_name]
    dedupe_key: []               # this form has no school code — joined by name in roster.py
    target: 165
    quality: { min_duration_minutes: 1 }

  # District-level forms (one submission per district visit)
  - key: district_meeting
    name: "District Entry Meeting Checklist"
    uid: aGUvS64iEXZ6iANRKySPRT
    group_by: [district, region]
    dedupe_key: [district]
    quality: { min_duration_minutes: 1 }

  - key: district_pre_entry
    name: "District Pre-Entry Meeting Checklist"
    uid: a7MfPjqYzU6MVRefeukEpF
    group_by: [district, region]
    dedupe_key: [district]
    quality: { min_duration_minutes: 1 }

  - key: district_entry_prep
    name: "District Entry Preparation Checklist"
    uid: aUngKSUyshfP9f2ncmgpzF
    group_by: [district, region]
    dedupe_key: [district]
    quality: { min_duration_minutes: 1 }

  # Prospective logs (continuous entries by school staff; aggregated to school-weeks by
  # scripts/prospective.py — see config/prospective.yml)
  - key: nurse_log
    name: "Nurse log (prospective)"
    uid: anWs3BHcedteBeE4KVm2aY
    group_by: [district, school_name]
    dedupe_key: []               # many entries per school by design
    quality: { min_duration_minutes: 1 }

  - key: bursar_log
    name: "Bursar log (prospective)"
    uid: aKHoLcChEGxRqCksRpadQN
    group_by: [district, school_name]
    dedupe_key: []
    quality: { min_duration_minutes: 1 }

# Data-quality thresholds
quality:
  min_duration_minutes: 3      # submissions faster than this are flagged
  max_duration_minutes: 600    # slower than this (left open across a visit) are flagged
  working_hours: [6, 21]       # local-time start hour, end hour; outside = flagged
