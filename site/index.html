<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SENSE Schools Monitor</title>
<meta name="description" content="Recruitment, school infrastructure, mosquito prevention, nurse and testing indicators for the SENSE study, from the KoboCollect forms">
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10);
    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100; --series-5: #e87ba4; --series-6: #008300; --series-7: #6250d6; --series-8: #e34948;
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --good-text: #006300;
    --side: #1d2b2a; --side-ink: #e8ece9; --side-muted: #9fb0ab;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
      --good-text: #0ca30c; --side: #111a19;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
    --good-text: #0ca30c; --side: #111a19;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  aside { background: var(--side); color: var(--side-ink); padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow: auto; }
  aside .brand { font-weight: 700; font-size: 16px; line-height: 1.25; }
  aside .brand small { display: block; color: var(--side-muted); font-weight: 400; font-size: 11px; margin-top: 4px; font-family: ui-monospace, monospace; }
  #nav { display: flex; flex-direction: column; gap: 2px; margin-top: 22px; }
  #nav a { color: var(--side-ink); text-decoration: none; padding: 8px 10px; border-radius: 6px; font-size: 13.5px; }
  #nav a:hover { background: rgba(255,255,255,0.06); }
  #nav a[aria-current="true"] { background: rgba(255,255,255,0.12); font-weight: 600; }
  #nav a.soon { color: var(--side-muted); cursor: default; }
  aside .foot { position: absolute; bottom: 16px; left: 14px; right: 14px; color: var(--side-muted); font-size: 11px; font-family: ui-monospace, monospace; }
  main { padding: 20px 24px 64px; min-width: 0; }
  .topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; margin-bottom: 6px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 16px; margin: 28px 0 10px; }
  h3 { font-size: 13px; color: var(--ink-2); margin: 18px 0 8px; text-transform: uppercase; letter-spacing: 0.04em; }
  .card h3:first-child { margin-top: 0; }
  .card h3 .sub, .card .subtitle { display: block; text-transform: none; letter-spacing: 0; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .sub { color: var(--ink-2); }
  .stale { color: var(--critical); font-weight: 600; }
  #filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-left: auto; }
  #filters label { display: flex; flex-direction: column; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  #filters select, #filters button { font: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid var(--axis); border-radius: 6px; background: var(--surface); color: var(--ink); max-width: 320px; }
  #filters button { align-self: end; cursor: pointer; }
  .crumbs { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; margin: 6px 0 14px; }
  .card { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 14px 16px; min-width: 0; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .tile .label { color: var(--ink-2); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; }
  .tile .value { font-size: 26px; font-weight: 600; margin-top: 2px; }
  .tile .value.small { font-size: 14px; font-weight: 500; line-height: 1.5; text-transform: none; letter-spacing: 0; }
  .tile .note { color: var(--muted); font-size: 12px; }
  .bar { height: 6px; background: var(--grid); border-radius: 3px; overflow: hidden; margin: 8px 0 4px; }
  .bar > div { height: 100%; background: var(--series-1); border-radius: 3px; }
  .meta { color: var(--muted); font-size: 12px; }
  .flag { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  th { color: var(--ink-2); font-weight: 600; font-size: 12px; white-space: nowrap; }
  th.sortable { cursor: pointer; user-select: none; }
  td.num, th.num { text-align: right; }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: color-mix(in srgb, var(--series-1) 8%, transparent); }
  tr.row[aria-selected="true"] td { background: color-mix(in srgb, var(--series-1) 14%, transparent); }
  .cellbar { display: flex; align-items: center; gap: 8px; min-width: 160px; }
  .cellbar .track { flex: 1; height: 8px; background: var(--grid); border-radius: 4px; overflow: hidden; position: relative; }
  .cellbar .track > div { height: 100%; background: var(--series-1); border-radius: 4px; }
  .cellbar .track > .asd { position: absolute; top: 0; left: 0; background: var(--series-3); }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
  .three { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
  .scroll { max-height: 560px; overflow: auto; }
  .status { display: inline-flex; gap: 4px; }
  .status span { width: 18px; height: 18px; border-radius: 4px; font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; color: #fff; background: var(--axis); }
  .status span.on { background: var(--series-1); }
  .status span.A.on { background: var(--series-3); }
  .chip { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; background: var(--grid); color: var(--ink-2); margin-right: 3px; white-space: nowrap; }
  .chip.no, .chip.critical { background: color-mix(in srgb, var(--critical) 18%, transparent); color: var(--critical); }
  .chip.good { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good-text); }
  .chip.warning { background: color-mix(in srgb, var(--warning) 28%, transparent); color: #7a5200; }
  .chart-wrap { position: relative; }
  svg text { fill: var(--muted); font-size: 11px; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--ring); border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); display: none; white-space: nowrap; z-index: 2; }
  details summary { cursor: pointer; color: var(--ink-2); }
  .empty { color: var(--muted); font-style: italic; }
  code { font-size: 12px; background: var(--grid); padding: 1px 4px; border-radius: 3px; }
  .legend { color: var(--ink-2); font-size: 12px; margin: 6px 0; }
  ul { margin: 4px 0 4px 18px; padding: 0; }
  .overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 8px; }
  .overview .card { cursor: pointer; }
  .overview .card:hover, .overview .card[aria-current="true"] { outline: 2px solid var(--series-1); outline-offset: -1px; }
  .big { font-size: 28px; font-weight: 600; margin: 4px 0 2px; }
  .fname { font-weight: 600; }
  /* bar list */
  .barlist { display: flex; flex-direction: column; gap: 7px; }
  .barrow { display: grid; grid-template-columns: minmax(110px, 38%) 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
  .barlabel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .barrow .track { height: 10px; background: var(--grid); border-radius: 5px; overflow: hidden; }
  .barrow .track > div { height: 100%; border-radius: 5px; }
  .barval { font-variant-numeric: tabular-nums; min-width: 2.5em; text-align: right; }
  /* toggles */
  .toggles { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 10px; }
  .toggles button { font: inherit; font-size: 12.5px; padding: 4px 10px; border: 1px solid var(--axis); background: var(--surface); color: var(--ink-2); border-radius: 6px; cursor: pointer; }
  .toggles button[aria-pressed="true"] { background: var(--series-1); border-color: var(--series-1); color: #fff; }
  /* donut */
  .donut { display: grid; grid-template-columns: 150px 1fr; gap: 14px; align-items: center; }
  .donut .dlegend { display: flex; flex-direction: column; gap: 5px; font-size: 13px; }
  .donut .dlegend div { display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: center; }
  .donut .dlegend .sw { width: 12px; height: 12px; border-radius: 3px; }
  .donut .centre { font-size: 20px; font-weight: 600; }
  @media (max-width: 760px) { .app { grid-template-columns: 1fr; } aside { position: static; height: auto; } aside .foot { position: static; margin-top: 16px; } #nav { flex-direction: row; flex-wrap: wrap; } main { padding: 16px; } .tile .value { font-size: 22px; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">SENSE Schools Monitor<small>Annex F, G, H · assessments · district checklists</small></div>
    <nav id="nav"></nav>
    <div class="foot" id="freshness">Loading…</div>
  </aside>
  <main>
    <div class="topbar"><h1 id="page-title">SENSE</h1><div id="filters" hidden></div></div>
    <div class="crumbs" id="crumbs"></div>
  </main>
</div>
<script src="js/common.js"></script>
<script src="js/charts.js"></script>
<script src="js/recruitment.js"></script>
<script src="js/forms.js"></script>
<script src="js/retro.js"></script>
<script src="js/infra.js"></script>
<script src="js/prevention.js"></script>
<script src="js/structures.js"></script>
<script src="js/nurse.js"></script>
<script src="js/practices.js"></script>
</body>
</html>
