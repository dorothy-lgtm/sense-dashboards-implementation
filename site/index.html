<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SENSE Recruitment Monitor</title>
<meta name="description" content="Recruitment progress, assessment lag and data quality for the SENSE study KoboCollect forms">
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10);
    --series-1: #2a78d6; --series-3: #1baf7a; --seq-200: #9ec5f4;
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --good-text: #006300;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
      --series-1: #3987e5; --series-3: #199e70; --seq-200: #1c5cab; --good-text: #0ca30c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
    --series-1: #3987e5; --series-3: #199e70; --seq-200: #1c5cab; --good-text: #0ca30c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1160px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 16px; margin: 28px 0 10px; }
  h3 { font-size: 13px; color: var(--ink-2); margin: 18px 0 8px; text-transform: uppercase; letter-spacing: 0.04em; }
  .sub { color: var(--ink-2); margin-top: 4px; }
  .stale { color: var(--critical); font-weight: 600; }
  nav { display: flex; gap: 4px; margin: 18px 0 6px; border-bottom: 1px solid var(--grid); }
  nav button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; font: inherit; color: var(--ink-2); cursor: pointer; }
  nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--series-1); font-weight: 600; }
  .card { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 14px 16px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .tile .label { color: var(--ink-2); font-size: 12px; }
  .tile .value { font-size: 26px; font-weight: 600; margin-top: 2px; }
  .tile .value.small { font-size: 14px; font-weight: 500; line-height: 1.5; }
  .tile .note { color: var(--muted); font-size: 12px; }
  .bar { height: 6px; background: var(--grid); border-radius: 3px; overflow: hidden; margin: 8px 0 4px; }
  .bar > div { height: 100%; background: var(--series-1); border-radius: 3px; }
  .meta { color: var(--muted); font-size: 12px; }
  .flag { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  th { color: var(--ink-2); font-weight: 600; font-size: 12px; white-space: nowrap; }
  td.num, th.num { text-align: right; }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: color-mix(in srgb, var(--series-1) 8%, transparent); }
  tr.row[aria-selected="true"] td { background: color-mix(in srgb, var(--series-1) 14%, transparent); }
  .cellbar { display: flex; align-items: center; gap: 8px; min-width: 160px; }
  .cellbar .track { flex: 1; height: 8px; background: var(--grid); border-radius: 4px; overflow: hidden; position: relative; }
  .cellbar .track > div { height: 100%; background: var(--series-1); border-radius: 4px; }
  .cellbar .track > .asd { position: absolute; top: 0; left: 0; background: var(--series-3); }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
  .scroll { max-height: 560px; overflow: auto; }
  .status { display: inline-flex; gap: 4px; }
  .status span { width: 18px; height: 18px; border-radius: 4px; font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; color: #fff; background: var(--axis); }
  .status span.on { background: var(--series-1); }
  .status span.A.on { background: var(--series-3); }
  .chip { display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 11px; background: var(--grid); color: var(--ink-2); margin-right: 3px; }
  .chip.no { background: color-mix(in srgb, var(--serious) 25%, transparent); }
  .chart-wrap { position: relative; }
  svg text { fill: var(--muted); font-size: 11px; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--ring); border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); display: none; white-space: nowrap; }
  details summary { cursor: pointer; color: var(--ink-2); }
  .empty { color: var(--muted); font-style: italic; }
  code { font-size: 12px; background: var(--grid); padding: 1px 4px; border-radius: 3px; }
  .legend { color: var(--ink-2); font-size: 12px; margin: 6px 0; }
  ul { margin: 4px 0 4px 18px; padding: 0; }
  .overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 8px; }
  .overview .card { cursor: pointer; }
  .overview .card:hover, .overview .card[aria-current="true"] { outline: 2px solid var(--series-1); outline-offset: -1px; }
  .big { font-size: 28px; font-weight: 600; margin: 4px 0 2px; }
  .fname { font-weight: 600; }
  @media (max-width: 600px) { .tile .value { font-size: 22px; } }
</style>
</head>
<body>
<main>
  <h1>SENSE Recruitment Monitor</h1>
  <div class="sub" id="freshness">Loading…</div>
  <nav role="tablist">
    <button role="tab" data-view="recruit" aria-selected="true">Recruitment</button>
    <button role="tab" data-view="forms" aria-selected="false">Form monitoring</button>
  </nav>
  <section id="recruit"></section>
  <section id="forms" hidden></section>
</main>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDT = iso => iso ? new Date(iso).toLocaleString("en-GB", { timeZone: "Africa/Kampala", day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "—";
const fmtD = iso => iso ? new Date(iso + (iso.length === 10 ? "T00:00:00" : "")).toLocaleDateString("en-GB", { day: "2-digit", month: "short" }) : "—";
const num = v => (v === null || v === undefined) ? "—" : v.toLocaleString("en-GB");
const titleCase = s => String(s ?? "").toLowerCase().replace(/\b\w/g, c => c.toUpperCase());

let SUMMARY = null, ROSTER = null, district = null, currentForm = null;

async function load() {
  const [s, r] = await Promise.all([fetch("data/summary.json", { cache: "no-store" }), fetch("data/roster.json", { cache: "no-store" })]);
  if (!s.ok) { $("#freshness").textContent = "No data yet — the first scheduled run has not completed."; return; }
  SUMMARY = await s.json();
  ROSTER = r.ok ? await r.json() : null;
  const pulled = new Date(SUMMARY.pulled_at || SUMMARY.generated_at);
  const ageH = (Date.now() - pulled) / 36e5;
  $("#freshness").innerHTML = `Data pulled from KoboToolbox ${fmtDT(pulled.toISOString())} EAT` +
    (ageH > 6 ? ` <span class="stale">(${Math.round(ageH)} h old — check the GitHub Action)</span>` : "");
  document.querySelectorAll("nav button").forEach(b => b.onclick = () => showView(b.dataset.view));
  const [view, arg] = location.hash.slice(1).split("/");
  if (view === "forms") { showView("forms"); selectForm(arg || SUMMARY.forms[0].key); }
  else { showView("recruit"); renderRecruit(); if (arg) selectDistrict(decodeURIComponent(arg)); }
}

function showView(v) {
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === v));
  $("#recruit").hidden = v !== "recruit"; $("#forms").hidden = v !== "forms";
  if (v === "forms" && !$("#forms").innerHTML) { renderFormsOverview(); selectForm(SUMMARY.forms[0].key); }
  if (v === "recruit" && !$("#recruit").innerHTML) renderRecruit();
  location.hash = v === "forms" ? `forms/${currentForm || ""}` : `recruit/${district ? encodeURIComponent(district) : ""}`;
}

function tile(label, value, note = "", small = false) {
  return `<div class="card tile"><div class="label">${label}</div><div class="value${small ? " small" : ""}">${value}</div><div class="note">${note}</div></div>`;
}
function flagTile(label, n, total, color, note) {
  const sev = n === 0 ? "var(--good)" : color;
  const pct = total ? ` <span class="meta">(${(100 * n / total).toFixed(1)}%)</span>` : "";
  return `<div class="card tile"><div class="label flag"><span class="dot" style="background:${sev}"></span>${label}</div><div class="value">${num(n)}${pct}</div><div class="note">${note}</div></div>`;
}
function table(headers, rows, empty = "Nothing to show", rowAttrs = () => "") {
  if (!rows.length) return `<p class="empty">${empty}</p>`;
  return `<table><thead><tr>${headers.map(h => `<th class="${h.num ? "num" : ""}">${h.t}</th>`).join("")}</tr></thead>
    <tbody>${rows.map((r, i) => `<tr ${rowAttrs(r, i)}>${r.map((c, j) => `<td class="${headers[j].num ? "num" : ""}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}

/* ------------------------------------------------------------ recruitment view */
function renderRecruit() {
  const el = $("#recruit");
  if (!ROSTER) { el.innerHTML = `<p class="empty">roster.json not available yet.</p>`; return; }
  const t = ROSTER.totals, target = t.recruitment_target;
  const pct = target ? Math.round(1000 * t.schools_recruited / target) / 10 : null;
  const openedTile = tile("Districts opened", num(t.districts_opened), `entry-meeting form submitted · ${num(t.districts_in_config)} study districts` +
      (t.districts_entered_without_meeting_form ? `<br><span class="flag"><span class="dot" style="background:var(--warning)"></span>${num(t.districts_entered_without_meeting_form)} more have schools but no meeting form</span>` : ""));
  const pipelineTile = tile("Districts in pipeline", `${num(t.districts_prep + t.districts_pre_entry)}`, `${num(t.districts_prep)} preparation · ${num(t.districts_pre_entry)} pre-entry done · ${num(t.districts_scheduled)} with a meeting date set`);
  const elig = Object.entries(t.screening_outcomes || {}).map(([k, v]) => `${esc(titleCase(k))}: ${num(v)}`).join(" · ");
  el.innerHTML = `
    <div class="tiles">
      ${openedTile}
      ${tile("Districts entered", num(t.districts_entered), "≥1 school with Annex H")}
      ${pipelineTile}
      <div class="card tile"><div class="label">Schools recruited</div><div class="value">${num(t.schools_recruited)}<span class="meta"> / ${num(target)}</span></div>
        <div class="bar"><div style="width:${Math.min(100, pct)}%"></div></div><div class="note">${pct}% · +${num(t.recruited_last_7d)} in last 7 days${t.districts_with_target ? ` · eligible-school counts known for ${num(t.districts_with_target)} districts (${num(t.target_schools_known)} schools)` : ""}</div></div>
      ${tile("Assessment forms entered", num(t.schools_assessed), `${num(t.assessment_submissions)} forms, ${num(t.assessment_matched)} matched to a recruited school`)}
      ${flagTile("Awaiting assessment", t.awaiting_assessment, t.schools_recruited, "var(--warning)",
         t.median_open_lag_days !== null ? `median wait ${t.median_open_lag_days} d · longest ${t.max_open_lag_days} d` : "")}
      ${tile("Screened (Annex F)", num(t.screening_submissions), elig || "", !!elig)}
    </div>

    <h3>Recruitment by district <span class="meta">— click a district for its schools</span></h3>
    <div class="legend"><span class="dot" style="background:var(--series-1)"></span> recruited &nbsp; <span class="dot" style="background:var(--series-3)"></span> of which assessed &nbsp; · bar length vs the district's eligible schools (pre-entry form "target schools mobilized", or config/districts.csv) &nbsp; · stage from the district checklists: preparation → pre-entry → opened (entry meeting)</div>
    <div class="card scroll" id="districts"></div>

    <h3 id="schools-title">Schools</h3>
    <div class="card scroll" id="schools"></div>

    <h3>Data issues to fix in Kobo</h3>
    <div class="two" id="issues"></div>`;
  renderDistricts();
  renderSchools();
  renderIssues();
}

const STAGE_COLOR = { 0: "var(--axis)", 1: "var(--warning)", 2: "var(--warning)", 3: "var(--good)" };
function stageCell(d) {
  const col = d.entered && !d.opened ? "var(--serious)" : STAGE_COLOR[d.stage_rank];
  let detail = "";
  if (d.opened) detail = `${fmtD(d.date_opened)}${d.meeting ? ` · ${d.meeting.schools_attended ?? "?"} schools attended${String(d.meeting.mou_signed).toLowerCase() === "yes" ? " · MOU" : ""}` : ""}`;
  else if (d.scheduled_meeting) detail = `meeting ${fmtD(d.scheduled_meeting)}`;
  else if (d.pre_entry) detail = `${d.pre_entry.confirmed ?? "?"} schools confirmed`;
  else if (d.entered) detail = `first school ${fmtD(d.first_recruited)}`;
  return `<span class="flag"><span class="dot" style="background:${col}"></span>${esc(d.stage)}</span>${detail ? `<br><span class="meta">${detail}</span>` : ""}`;
}
function renderDistricts() {
  const ds = [...ROSTER.districts].sort((a, b) => (b.entered - a.entered) || (b.stage_rank - a.stage_rank) || a.district.localeCompare(b.district));
  const maxRef = Math.max(1, ...ds.map(d => d.target_schools || d.recruited));
  const rows = ds.map(d => {
    const ref = d.target_schools || maxRef;
    const bar = `<div class="cellbar"><div class="track"><div style="width:${Math.min(100, 100 * d.recruited / ref)}%"></div><div class="asd" style="width:${Math.min(100, 100 * d.assessed / ref)}%"></div></div><span>${num(d.recruited)}${ref !== maxRef ? `<span class="meta"> / ${ref}</span>` : ""}</span></div>`;
    const lag = d.awaiting_assessment ? `${d.awaiting_assessment}${d.max_open_lag_days !== null ? ` <span class="meta">(up to ${d.max_open_lag_days} d)</span>` : ""}` : `<span class="meta">${d.recruited ? 0 : "—"}</span>`;
    const formT = d.pre_entry ? d.pre_entry.target : null;
    const disagree = d.target_schools !== null && formT !== null && formT !== d.target_schools;
    const target = d.target_schools !== null
      ? `${num(d.target_schools)}<br><span class="meta">${esc(d.target_source || "")}${disagree ? ` · <span class="chip no">pre-entry form says ${num(formT)}</span>` : ""}</span>`
      : `<span class="meta">—</span>`;
    return [esc(d.district) + (d.in_config ? "" : ` <span class="chip">not in districts.csv</span>`), esc(d.sub_region || ""), stageCell(d), target, num(d.screened), bar, num(d.assessed), lag];
  });
  $("#districts").innerHTML = table(
    [{t:"District"},{t:"Sub-region"},{t:"Stage"},{t:"Eligible schools",num:true},{t:"Screened",num:true},{t:"Recruited"},{t:"Assessed",num:true},{t:"Awaiting assessment",num:true}],
    rows, "No districts yet", (r, i) => `class="row" data-d="${esc(ds[i].district)}" aria-selected="${ds[i].district === district}"`);
  $("#districts").querySelectorAll("tr.row").forEach(tr => tr.onclick = () => selectDistrict(tr.dataset.d === district ? null : tr.dataset.d));
}

function selectDistrict(d) {
  district = d;
  location.hash = `recruit/${d ? encodeURIComponent(d) : ""}`;
  $("#districts").querySelectorAll("tr.row").forEach(tr => tr.setAttribute("aria-selected", tr.dataset.d === d));
  renderSchools();
  $("#schools-title").scrollIntoView({ behavior: "smooth", block: "start" });
}

function statusCell(s) {
  const f = s.forms;
  return `<span class="status" title="F enrolment · G structure · H retrospective · A assessment">
    <span class="F ${f.F ? "on" : ""}">F</span><span class="G ${f.G ? "on" : ""}">G</span><span class="H ${f.H ? "on" : ""}">H</span><span class="A ${f.A ? "on" : ""}">A</span></span>`;
}
function checklist(a) {
  return Object.entries(a || {}).map(([k, v]) => `<span class="chip ${String(v).toLowerCase() === "no" ? "no" : ""}">${esc(k)}: ${esc(v ?? "—")}</span>`).join("");
}
function renderSchools() {
  const all = ROSTER.schools.filter(s => !district || s.district === district);
  const rec = all.filter(s => s.recruited);
  $("#schools-title").innerHTML = district
    ? `${esc(district)} — ${rec.length} recruited school${rec.length === 1 ? "" : "s"} <span class="meta">(${all.length} on roster) · <a href="#" id="clear">show all districts</a></span>`
    : `All schools — ${rec.length} recruited <span class="meta">(${all.length} on roster)</span>`;
  const clear = $("#clear"); if (clear) clear.onclick = e => { e.preventDefault(); selectDistrict(null); };
  const rows = all.map(s => [
    `<b>${esc(s.name)}</b>${s.suspect_name_forms.length ? ` <span class="chip no" title="The school-name field in this form does not look like a school name (possibly a person's name)">check name in ${esc(s.suspect_name_forms.join("/"))}</span>` : ""}<br><span class="meta">${esc(s.code)}${s.name_variants.length ? ` · also entered as: ${esc(s.name_variants.join("; "))}` : ""}</span>`,
    district ? "" : esc(s.district || "?") + (s.district_conflict ? ` <span class="chip no">district differs across forms</span>` : ""),
    statusCell(s),
    s.eligibility ? esc(titleCase(s.eligibility)) : "<span class='meta'>—</span>",
    s.recruited ? `${fmtD(s.recruited_date)}${s.retro_terms.length ? `<br><span class="meta">${esc(s.retro_terms.join(", "))}</span>` : `<br><span class="chip no">no term recorded</span>`}` : "<span class='meta'>not yet</span>",
    s.assessed ? `${fmtD(s.assessed_date)}<br>${checklist(s.assessment)}` : (s.recruited ? `<span class="flag"><span class="dot" style="background:${s.lag_days > 14 ? "var(--serious)" : "var(--warning)"}"></span>waiting ${s.lag_days} d</span>` : "<span class='meta'>—</span>"),
  ]);
  const headers = [{t:"School"},{t:"District"},{t:"Forms"},{t:"Screening"},{t:"Recruited (Annex H) · terms entered"},{t:"Assessment"}];
  if (district) headers.splice(1, 1), rows.forEach(r => r.splice(1, 1));
  $("#schools").innerHTML = table(headers, rows, "No schools on the roster for this selection");
}

function renderIssues() {
  const un = ROSTER.assessment_unmatched, am = ROSTER.assessment_ambiguous;
  const noD = ROSTER.schools_without_district;
  const conflicts = ROSTER.schools.filter(s => s.district_conflict);
  const dupeNames = ROSTER.schools.filter(s => s.name_variants.length);
  const sus = ROSTER.suspect_school_names || [], dupC = ROSTER.duplicate_codes || [];
  const anr = ROSTER.assessed_not_recruited || [], rns = ROSTER.recruited_not_screened || [];
  const li = arr => arr.map(x => `<li>${x}</li>`).join("");
  $("#issues").innerHTML = `
    <div class="card"><h3>Assessment forms not matched to a recruited school (${un.length + am.length})</h3>
      <p class="meta">The assessment form has no school code, so it is matched by school name + district. Fix the name in Kobo, or add the school-code question to the form.</p>
      ${table([{t:"Kobo _id"},{t:"School name as typed"},{t:"District"},{t:"Problem"}],
        un.map(u => [u.id, esc(u.name || "(blank)"), esc(u.district || "—"), esc(u.reason)])
          .concat(am.map(a => [a.id, esc(a.name), esc(a.district || "—"), "ambiguous — could be: " + esc(a.candidates.join(" | "))])), "All assessment forms matched")}</div>
    <div class="card"><h3>Roster inconsistencies (${sus.length + dupC.length + anr.length + rns.length + conflicts.length + noD.length})</h3>
      ${dupC.length ? `<p><b>Same school under two codes</b> — one form used a different code; the school is split in two:<ul>${li(dupC.map(d => `${esc(d.name)} — ${d.codes.map(c => `${esc(c)} (forms ${esc(d.forms[c] || "–")})`).join(" and ")}${d.districts.length > 1 ? ` — codes belong to different districts: ${esc(d.districts.join(" / "))}` : ` (${esc(d.districts[0])})`}`))}</ul></p>` : ""}
      ${sus.length ? `<p><b>School-name field doesn't look like a school name</b> — probably a person's name typed in the wrong box (text withheld here; open the record in Kobo):<ul>${li(sus.map(x => `${esc(x.code)} in Annex ${esc(x.forms.join("/"))} (${esc(x.district || "?")})${x.name_known ? "" : " — no valid school name in any form"}`))}</ul></p>` : ""}
      ${anr.length ? `<p><b>Assessment entered but no Annex H</b> (not counted as recruited):<ul>${li(anr.map(x => `${esc(x.code)} ${esc(x.name)} (${esc(x.district || "?")}), assessed ${fmtD(x.assessed_date)}`))}</ul></p>` : ""}
      ${rns.length ? `<p><b>Annex H entered but no Annex F screening form</b>:<ul>${li(rns.map(x => `${esc(x.code)} ${esc(x.name)} (${esc(x.district || "?")})`))}</ul></p>` : ""}
      ${conflicts.length ? `<p><b>District typed differently from the code's district</b>: ${conflicts.map(s => esc(`${s.code} (typed ${s.district_typed || "blank"}, code says ${s.district})`)).join("; ")}</p>` : ""}
      ${noD.length ? `<p><b>${noD.length}</b> school(s) with no district: ${esc(noD.join(", "))}</p>` : ""}
      ${dupeNames.length ? `<p class="meta">${dupeNames.length} school code(s) entered with more than one spelling of the name (harmless; shown under each school).</p>` : ""}
      ${ROSTER.notes.map(n => `<p class="meta">${esc(n)}</p>`).join("")}
      ${!sus.length && !dupC.length && !anr.length && !rns.length && !conflicts.length && !noD.length ? `<p class="empty">None</p>` : ""}
    </div>`;
}

/* ------------------------------------------------------------ form monitoring view */
function renderFormsOverview() {
  $("#forms").innerHTML = `<div class="overview" id="overview"></div><section id="detail"></section>`;
  $("#overview").innerHTML = SUMMARY.forms.map(f => {
    if (f.error) return `<div class="card" data-key="${f.key}"><div class="fname">${esc(f.name)}</div><div class="meta stale">${esc(f.error)}</div></div>`;
    const t = f.totals;
    return `<div class="card" data-key="${f.key}" tabindex="0"><div class="fname">${esc(f.name)}</div>
      <div class="big">${num(t.submissions)}</div>
      <div class="meta">${t.distinct_units !== null ? `${num(t.distinct_units)} distinct schools · ` : ""}+${t.last_24h} in 24 h · last ${fmtDT(t.last_submission)}</div></div>`;
  }).join("");
  $("#overview").querySelectorAll(".card").forEach(c => { c.onclick = () => selectForm(c.dataset.key); c.onkeydown = e => { if (e.key === "Enter" || e.key === " ") selectForm(c.dataset.key); }; });
}

function selectForm(key) {
  currentForm = key;
  location.hash = `forms/${key}`;
  $("#overview").querySelectorAll(".card").forEach(c => c.setAttribute("aria-current", c.dataset.key === key));
  const f = SUMMARY.forms.find(x => x.key === key);
  $("#detail").innerHTML = f.error ? `<h2>${esc(f.name)}</h2><p class="stale">${esc(f.error)}</p>` : detailHTML(f);
  if (!f.error) drawDaily(f);
}

function detailHTML(f) {
  const t = f.totals, q = f.quality, d = f.duration_minutes, n = t.submissions;
  const groups = Object.entries(f.by_group).map(([g, rows]) => `<div class="card"><h3>By ${esc(g)} <span class="meta">(${esc(f.group_fields_found[g])})</span></h3>
      <div class="scroll">${table([{t:"Value"},{t:"Submissions",num:true}], rows.map(r => [esc(r.value), num(r.n)]))}</div></div>`).join("");
  const missing = f.group_fields_missing.length ? `<p class="meta">Not found in this form (edit <code>config/forms.yml</code>): ${f.group_fields_missing.map(esc).join(", ")}</p>` : "";
  const dupRows = q.duplicates.groups.map(g => [esc(Object.values(g.key).join(" / ")), num(g.n), g.ids.join(", ")]);
  return `
    <h2>${esc(f.name)} <span class="meta">Kobo: ${esc(f.kobo_name || "")} · ${f.deployment_active ? "deployed" : "<span class='stale'>not deployed</span>"}</span></h2>
    <div class="tiles">
      ${tile("Submissions", num(n), t.kobo_reported_count !== null && t.kobo_reported_count !== n ? `Kobo reports ${num(t.kobo_reported_count)}` : "all time")}
      ${t.distinct_units !== null ? tile("Distinct schools", num(t.distinct_units), `by ${esc(f.dedupe_fields.join(" + "))}`) : ""}
      ${tile("Last 24 h", num(t.last_24h), "")}
      ${tile("Last 7 days", num(t.last_7d), "")}
      ${tile("Median duration", d.median_min !== undefined ? `${d.median_min} min` : "—", d.n ? `p10 ${d.p10_min} · p90 ${d.p90_min}` : "no start/end times")}
      ${tile("First / last", `${fmtDT(t.first_submission)}<br>→ ${fmtDT(t.last_submission)}`, "", true)}
    </div>
    <h3>Submissions per day (EAT)</h3>
    <div class="card chart-wrap" id="daily"><div class="tip" id="tip"></div></div>
    <h3>Data quality</h3>
    <div class="tiles">
      ${f.dedupe_fields.length ? flagTile("Repeat submissions", q.duplicates.n, n, "var(--warning)", `extra records sharing ${f.dedupe_fields.join(" + ")}`) : ""}
      ${flagTile("Too fast", q.too_fast.n, n, "var(--serious)", `under ${q.too_fast.threshold_min} min`)}
      ${flagTile("Left open", q.too_slow.n, n, "var(--warning)", `over ${q.too_slow.threshold_min} min`)}
      ${flagTile("Outside hours", q.out_of_hours.n, n, "var(--warning)", `started outside ${q.out_of_hours.hours[0]}:00–${q.out_of_hours.hours[1]}:00`)}
      ${q.missing_gps.applicable ? flagTile("No GPS", q.missing_gps.n, n, "var(--warning)", "no geolocation captured") : ""}
      ${tile("Validation", Object.entries(f.validation).map(([k, v]) => `${esc(k)}: ${num(v)}`).join("<br>") || "—", "Kobo validation status", true)}
    </div>
    ${dupRows.length ? `<div class="card" style="margin-top:12px"><h3>Repeat submissions by school</h3><div class="scroll">${table([{t:"Key"},{t:"Records",num:true},{t:"Kobo _id"}], dupRows)}</div></div>` : ""}
    <div class="two" style="margin-top:12px">
      <div class="card"><h3>By data officer <span class="meta">(${esc(f.enumerator_basis)})</span></h3>
        ${table([{t:"Officer"},{t:"Submissions",num:true},{t:"Median min",num:true},{t:"Last"}], f.by_enumerator.map(e => [esc(e.user), num(e.n), e.median_min ?? "—", fmtDT(e.last_submission)]))}</div>
      <div class="card"><h3>Least-complete questions</h3>
        ${table([{t:"Question"},{t:"Type"},{t:"% answered",num:true}], f.completeness_lowest.map(c => [`<b>${esc(c.name)}</b><br><span class="meta">${esc(c.label)}</span>`, esc(c.type), c.pct]))}</div>
    </div>
    ${groups ? `<div class="two" style="margin-top:12px">${groups}</div>` : ""}
    ${missing}
    <details style="margin-top:16px"><summary>Questions in this form (${f.schema.length})</summary>
      <div class="card" style="margin-top:8px">${table([{t:"Name"},{t:"Type"},{t:"Label"},{t:"xpath"}], f.schema.map(s => [esc(s.name), esc(s.type), esc(s.label), `<code>${esc(s.xpath)}</code>`]))}</div></details>`;
}

function drawDaily(f) {
  const wrap = $("#daily"), tip = $("#tip");
  const rows = f.by_day, W = Math.max(600, wrap.clientWidth - 32), H = 180, padL = 36, padB = 24, padT = 10;
  const max = Math.max(1, ...rows.map(r => r.n));
  const bw = (W - padL) / rows.length, innerH = H - padB - padT;
  const y = v => padT + innerH - (v / max) * innerH;
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Submissions per day">`;
  [0, Math.ceil(max / 2), max].forEach(tv => { svg += `<line x1="${padL}" x2="${W}" y1="${y(tv)}" y2="${y(tv)}" stroke="var(--grid)"/><text x="${padL - 6}" y="${y(tv) + 4}" text-anchor="end">${tv}</text>`; });
  rows.forEach((r, i) => {
    const x = padL + i * bw + 1, w = Math.max(1, bw - 2), h = Math.max(0, y(0) - y(r.n));
    svg += `<rect x="${x}" y="${y(r.n)}" width="${w}" height="${h}" rx="${Math.min(4, w / 2)}" fill="var(--series-1)" data-i="${i}"/>`;
    svg += `<rect x="${x - 1}" y="${padT}" width="${w + 2}" height="${innerH}" fill="transparent" data-i="${i}"/>`;
    if (i % Math.ceil(rows.length / 10) === 0) svg += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${fmtD(r.date)}</text>`;
  });
  svg += `<line x1="${padL}" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)"/></svg>`;
  wrap.insertAdjacentHTML("beforeend", svg);
  wrap.onmousemove = e => {
    const i = e.target.dataset.i; if (i === undefined) { tip.style.display = "none"; return; }
    const r = rows[+i]; tip.style.display = "block"; tip.textContent = `${fmtD(r.date)}: ${r.n} submission${r.n === 1 ? "" : "s"}`;
    const b = wrap.getBoundingClientRect();
    tip.style.left = Math.min(e.clientX - b.left + 12, b.width - tip.offsetWidth - 8) + "px"; tip.style.top = (e.clientY - b.top - 32) + "px";
  };
  wrap.onmouseleave = () => tip.style.display = "none";
}

load().catch(e => { $("#freshness").textContent = "Could not load data: " + e; });
</script>
</body>
</html>
